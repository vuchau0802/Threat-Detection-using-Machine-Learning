services:
  threat-api:
    image: ${IMAGE_NAME:?IMAGE_NAME is required}
    environment:
      MODEL_PATH: /app/models/LogisticRegression.pkl
      DATASET_PATH: /app/data/cleaned_dataset.csv
      LOG_DB_PATH: /app/runtime/logs.db
      MAX_INPUT_CHARS: ${MAX_INPUT_CHARS:-2000}
      TRANSFORMER_MODEL: ${TRANSFORMER_MODEL:-unitary/toxic-bert}
      S3_SYNC_ON_STARTUP: ${S3_SYNC_ON_STARTUP:-true}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_KEY: ${AWS_S3_KEY:-threat-detection/artifacts.zip}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - threat-runtime:/app/runtime
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  threat-runtime:
  hf-cache:
