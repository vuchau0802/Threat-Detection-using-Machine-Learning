<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThreatScan — Cyberbullying Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;600;800&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />

    <style>
         :root {
            --bg: #090b0f;
            --surface: #0e1117;
            --border: #1e2530;
            --text: #c8d6e5;
            --muted: #4a5a6e;
            --accent: #00d4ff;
            --danger: #ff3b5c;
            --safe: #00e5a0;
            --mono: 'Share Tech Mono', monospace;
            --display: 'Barlow Condensed', sans-serif;
            --body: 'Barlow', sans-serif;
        }
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--body);
            font-weight: 300;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .15) 2px, rgba(0, 0, 0, .15) 4px);
            pointer-events: none;
            z-index: 9999;
        }
        
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            background: rgba(9, 11, 15, .85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .verdict.harassment {
            background: rgba(255, 184, 0, .08);
            border: 1px solid rgba(255, 184, 0, .4);
            color: #ffb800;
        }
        
        .verdict.toxic {
            background: rgba(168, 85, 247, .08);
            border: 1px solid rgba(168, 85, 247, .4);
            color: #a855f7;
        }
        
        .nav-brand {
            font-family: var(--display);
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--accent);
        }
        
        .nav-brand span {
            color: var(--text);
        }
        
        .nav-status {
            font-family: var(--mono);
            font-size: .65rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--safe);
            box-shadow: 0 0 6px var(--safe);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .3;
            }
        }
        
        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
        }
        
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeDown .6s ease both;
        }
        
        .hero-label {
            font-family: var(--mono);
            font-size: .65rem;
            letter-spacing: .25em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: .75rem;
        }
        
        .hero-title {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: .95;
            text-transform: uppercase;
            letter-spacing: -.01em;
            color: #fff;
        }
        
        .hero-title em {
            font-style: normal;
            color: var(--accent);
        }
        
        .hero-sub {
            margin-top: 1rem;
            font-size: .9rem;
            color: var(--muted);
            letter-spacing: .04em;
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
            position: relative;
            animation: fadeUp .5s ease both;
        }
        
        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--accent);
            border-style: solid;
        }
        
        .card::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }
        
        .card::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }
        
        .input-label {
            font-family: var(--mono);
            font-size: .65rem;
            letter-spacing: .2em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: .6rem;
        }
        
        textarea {
            width: 100%;
            min-height: 160px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-family: var(--mono);
            font-size: .9rem;
            line-height: 1.7;
            padding: 1rem;
            resize: vertical;
            transition: border-color .2s;
            outline: none;
        }
        
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(0, 212, 255, .03);
        }
        
        textarea::placeholder {
            color: var(--muted);
        }
        
        .input-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: .75rem;
        }
        
        .counter {
            font-family: var(--mono);
            font-size: .65rem;
            color: var(--muted);
        }
        
        .btn-scan {
            display: flex;
            align-items: center;
            gap: .6rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 3px;
            font-family: var(--display);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: .7rem 2rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform .15s, box-shadow .15s;
            width: 100%;
            margin-top: 1rem;
            justify-content: center;
        }
        
        .btn-scan::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .25) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform .4s;
        }
        
        .btn-scan:hover::before {
            transform: translateX(100%);
        }
        
        .btn-scan:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(0, 212, 255, .3);
        }
        
        .btn-scan:active {
            transform: translateY(0);
        }
        
        .btn-scan:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        
        .btn-scan svg {
            flex-shrink: 0;
        }
        
        #resultSection {
            margin-top: 2rem;
            display: none;
            animation: fadeUp .4s ease both;
        }
        
        .verdict {
            border-radius: 4px;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }
        
        .verdict::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: .08;
            background: repeating-linear-gradient(-45deg, currentColor 0, currentColor 1px, transparent 0, transparent 50%);
            background-size: 8px 8px;
        }
        
        .verdict.threat {
            background: rgba(255, 59, 92, .08);
            border: 1px solid rgba(255, 59, 92, .4);
            color: var(--danger);
        }
        
        .verdict.safe {
            background: rgba(0, 229, 160, .08);
            border: 1px solid rgba(0, 229, 160, .4);
            color: var(--safe);
        }
        
        .verdict-label {
            font-family: var(--display);
            font-weight: 800;
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: -.01em;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .verdict-sub {
            font-family: var(--mono);
            font-size: .65rem;
            letter-spacing: .15em;
            opacity: .7;
            margin-top: .25rem;
        }
        
        .ring-wrap {
            flex-shrink: 0;
            position: relative;
            width: 80px;
            height: 80px;
        }
        
        .ring-wrap svg {
            transform: rotate(-90deg);
        }
        
        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, .1);
            stroke-width: 5;
        }
        
        .ring-fill {
            fill: none;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 1s cubic-bezier(.4, 0, .2, 1);
        }
        
        .ring-val {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: .75rem;
            font-weight: 700;
            line-height: 1.1;
        }
        
        .ring-val small {
            font-size: .5rem;
            opacity: .6;
            font-weight: 400;
        }
        /* Metrics */
        
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        
        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem 1.25rem;
        }
        
        .metric-label {
            font-family: var(--mono);
            font-size: .6rem;
            letter-spacing: .2em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: .4rem;
        }
        
        .metric-value {
            font-family: var(--display);
            font-weight: 600;
            font-size: 1.5rem;
            color: #fff;
        }
        
        .bar-track {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-top: .6rem;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            transition: width 1s cubic-bezier(.4, 0, .2, 1);
        }
        
        .sentiment-pill {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-family: var(--mono);
            font-size: .75rem;
            padding: .3rem .8rem;
            border-radius: 2px;
            margin-top: .5rem;
            letter-spacing: .05em;
        }
        
        .sentiment-pill.positive {
            background: rgba(0, 229, 160, .12);
            color: var(--safe);
            border: 1px solid rgba(0, 229, 160, .3);
        }
        
        .sentiment-pill.negative {
            background: rgba(255, 59, 92, .12);
            color: var(--danger);
            border: 1px solid rgba(255, 59, 92, .3);
        }
        
        .sentiment-pill.neutral {
            background: rgba(74, 90, 110, .15);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        
        .highlight-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .highlight-header {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .65rem 1rem;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, .02);
        }
        
        .highlight-header-label {
            font-family: var(--mono);
            font-size: .6rem;
            letter-spacing: .2em;
            color: var(--muted);
            text-transform: uppercase;
            flex: 1;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .dot-r {
            background: #ff5f57;
        }
        
        .dot-y {
            background: #febc2e;
        }
        
        .dot-g {
            background: #28c840;
        }
        
        .highlight-body {
            padding: 1.25rem;
            font-family: var(--mono);
            font-size: .88rem;
            line-height: 1.8;
            color: var(--text);
            word-break: break-word;
        }
        
        .highlight-body mark {
            background: var(--danger) !important;
            color: #fff !important;
            padding: .1em .3em;
            border-radius: 2px;
            font-weight: 700;
        }
        
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, .3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        @media (max-width: 520px) {
            .metrics {
                grid-template-columns: 1fr;
            }
            .verdict {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <nav class="nav">
        <div class="nav-brand">Threat<span>Scan</span></div>
    </nav>

    <main class="page">

        <header class="hero">
            <div class="hero-label">// cyberbullying detection system</div>
            <h1 class="hero-title">Threat<br><em>Detection</em></h1>
            <p class="hero-sub">AI-powered analysis</p>
        </header>

        <div class="card">
            <div class="input-label">// input &gt; text payload</div>
            <textarea id="userText" placeholder="Paste or type text to scan…" spellcheck="false"></textarea>
            <div class="input-footer">
                <span class="counter" id="charCount">WORDS: 0 &nbsp;|&nbsp; CHARS: 0</span>
            </div>
            <button class="btn-scan" id="analyzeBtn">
                <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                </svg>
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnText">Run Analysis</span>
            </button>
        </div>

        <section id="resultSection">

            <div class="verdict" id="verdictBanner">
                <div>
                    <div class="verdict-label" id="verdictLabel">—</div>
                    <div class="verdict-sub" id="verdictSub">AWAITING SCAN</div>
                </div>
                <div class="ring-wrap">
                    <svg viewBox="0 0 80 80" width="80" height="80">
                        <circle class="ring-bg" cx="40" cy="40" r="35"/>
                        <circle class="ring-fill" id="ringFill" cx="40" cy="40" r="35"/>
                    </svg>
                    <div class="ring-val" id="ringVal">
                        <span id="ringPct">0%</span>
                        <small>CONF.</small>
                    </div>
                </div>
            </div>

            <div class="metrics">
                <div class="metric-card">
                    <div class="metric-label">// bullying probability</div>
                    <div class="metric-value" id="bullyingPct">—</div>
                    <div class="bar-track">
                        <div class="bar-fill" id="bullyingBar"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">// classification</div>
                    <div class="metric-value" id="classificationVal">—</div>
                    <div id="sentimentPill"></div>
                </div>
            </div>

            <div class="highlight-card">
                <div class="highlight-header">
                    <div class="dot dot-r"></div>
                    <div class="dot dot-y"></div>
                    <div class="dot dot-g"></div>
                    <div class="highlight-header-label">// annotated · flagged tokens highlighted</div>
                </div>
                <div class="highlight-body" id="highlightedText"></div>
            </div>

        </section>

    </main>

    <script>
        const textarea = document.getElementById('userText');
        const charCount = document.getElementById('charCount');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');
        const resultSection = document.getElementById('resultSection');
        const verdictBanner = document.getElementById('verdictBanner');
        const verdictLabel = document.getElementById('verdictLabel');
        const verdictSub = document.getElementById('verdictSub');
        const ringFill = document.getElementById('ringFill');
        const ringPct = document.getElementById('ringPct');
        const ringVal = document.getElementById('ringVal');
        const bullyingPct = document.getElementById('bullyingPct');
        const bullyingBar = document.getElementById('bullyingBar');
        const classificationVal = document.getElementById('classificationVal');
        const sentimentVal = document.getElementById('sentimentVal');
        const sentimentPill = document.getElementById('sentimentPill');
        const highlightedText = document.getElementById('highlightedText');

        const RING_CIRC = 2 * Math.PI * 35;
        textarea.addEventListener('input', () => {
            const t = textarea.value;
            const words = t.trim() ? t.trim().split(/\s+/).length : 0;
            charCount.textContent = `WORDS: ${words} | CHARS: ${t.length}`;
        });

        /* Ring */
        function setRing(pct, color) {
            const safePct = isFinite(pct) ? Math.min(100, Math.max(0, pct)) : 0;
            ringFill.style.strokeDashoffset = RING_CIRC * (1 - safePct / 100);
            ringFill.style.stroke = color;
            ringPct.textContent = Math.round(safePct) + '%';
            ringVal.style.color = color;
        }

        function renderResults(data) {
            if (!data || typeof data !== 'object') {
                showError('Unexpected response shape from server.');
                return;
            }

            const isThreat = Number(data.prediction) === 1;
            const pct = data.bullying_percentage || 0;
            const conf = Math.round((data.confidence ? data.confidence : pct / 100) * 100);

            const classMap = {
                'threat': {
                    label: 'Threat',
                    bg: 'rgba(255,59,92,.12)',
                    color: '#ff3b5c',
                    border: 'rgba(255,59,92,.3)',
                    icon: '⚠'
                },
                'harassment': {
                    label: 'Harassment',
                    bg: 'rgba(255,184,0,.12)',
                    color: '#ffb800',
                    border: 'rgba(255,184,0,.3)',
                    icon: '⚡'
                },
                'toxic': {
                    label: 'Toxic',
                    bg: 'rgba(168,85,247,.12)',
                    color: '#a855f7',
                    border: 'rgba(168,85,247,.3)',
                    icon: '☣'
                },
                'safe': {
                    label: 'Safe',
                    bg: 'rgba(0,229,160,.12)',
                    color: '#00e5a0',
                    border: 'rgba(0,229,160,.3)',
                    icon: '✓'
                },
            };

            const classification = String(data.classification || (isThreat ? 'Threat' : 'Safe'));
            const key = classification.toLowerCase();
            const cls = classMap[key] || (isThreat ? classMap['threat'] : classMap['safe']);
            const color = cls.color;

            verdictBanner.className = `verdict ${key in classMap ? key : (isThreat ? 'threat' : 'safe')}`;
            verdictLabel.textContent = isThreat ? 'THREAT DETECTED' : 'CONTENT SAFE';
            verdictSub.textContent = isThreat ?
                `CYBERBULLYING SIGNAL · ${pct}% CONFIDENCE` :
                'NO BULLYING INDICATORS FOUND';

            /* Ring */
            setRing(isThreat ? pct : 100 - pct, color);

            /* Bullying bar */
            bullyingPct.textContent = pct + '%';
            bullyingBar.style.width = pct + '%';
            bullyingBar.style.background = `linear-gradient(90deg, ${color}, ${color}88)`;

            /* Classification */
            classificationVal.textContent = String(data.sentiment || 'Neutral').toUpperCase();

            sentimentPill.innerHTML = `
    <span style="
        display:inline-flex;align-items:center;gap:.4rem;
        font-family:var(--mono);font-size:.75rem;
        padding:.3rem .8rem;border-radius:2px;margin-top:.5rem;
        letter-spacing:.05em;
        background:${cls.bg};color:${cls.color};border:1px solid ${cls.border};
    ">${cls.icon} ${cls.label}</span>`;

            /* Highlighted text */
            highlightedText.innerHTML = data.highlighted || textarea.value;

            resultSection.style.display = 'block';
            resultSection.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        }

        function showError(msg) {
            alert('Analysis failed: ' + msg);
        }

        function setLoading(on) {
            analyzeBtn.disabled = on;
            btnIcon.style.display = on ? 'none' : 'block';
            btnSpinner.style.display = on ? 'block' : 'none';
            btnText.textContent = on ? 'Scanning…' : 'Run Analysis';
        }

        /* Main click handler */
        analyzeBtn.addEventListener('click', async() => {
            const input = textarea.value.trim();
            if (!input) {
                textarea.focus();
                textarea.style.borderColor = 'var(--danger)';
                setTimeout(() => (textarea.style.borderColor = ''), 800);
                return;
            }

            setLoading(true);

            try {
                const res = await fetch('/api/v1/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: input
                    }),
                });

                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    throw new Error(errBody.error || `Server error ${res.status}`);
                }

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                renderResults(data);

            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        });

        textarea.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') analyzeBtn.click();
        });
    </script>

</body>

</html>
